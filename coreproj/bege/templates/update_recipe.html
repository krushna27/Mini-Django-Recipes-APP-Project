<div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Recipe Management System</h1>
        
        <!-- Recipe Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Add New Recipe</h2>
                {% csrf_token %}
            <form  class="space-y-4"  method="post" enctype="multipart/form-data">
                <input type="hidden" id="recipeId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="recipeName" class="block text-sm font-medium text-gray-700 mb-1">Recipe Name</label>
    <input  name="recipe_name" type="text" value="{{ receipe.recipe_name }}" placeholder="Recipe Name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required />
                            
                    </div>
                    <div>
                        <label for="recipeDescription" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
    <textarea name="recipe_desc"  placeholder="Recipe Desciption" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 " required>{{ receipe.recipe_desc }}</textarea>
                            
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Recipe Image</label>
                    <div class="mt-1 flex items-center space-x-4">
                        
                        <div>
    <input  name="recipe_img" type="file" value="{{ receipe.recipe_img }}" placeholder="Recipe Image" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 " required/>
                            <button type="button" onclick="document.getElementById('recipeImage').click()" 
                                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                Choose Image
                            </button>
                        </div>
                    </div>
                </div>
                 <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full  px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Submit</button>

            </form>
        </div>
        
</div>






{% endblock %}
