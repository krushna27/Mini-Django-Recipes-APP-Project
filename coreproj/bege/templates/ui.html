{% extends "base.html" %}

{% block start %}
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Recipe Management System</h1>
        
        <!-- Recipe Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Add New Recipe</h2>
                
            <form  class="space-y-4"  method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" id="recipeId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="recipeName" class="block text-sm font-medium text-gray-700 mb-1">Recipe Name</label>
                        <input type="text" id="recipeName" name="recipe_name"  
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="recipeDescription" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea type="text" id="recipeDescription"  name="recipe_desc" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Recipe Image</label>
                    <div class="mt-1 flex items-center space-x-4">
                        
                        <div>
                           <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Recipe Image</label>
    <input  name="recipe_img" type="file" placeholder="Recipe Image" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 " required/>
                        </div>
                    </div>
                </div>
                  <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full  px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Submit</button>

            </form>
        </div>
        
        <!-- Search and Table Section -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-700">Recipe List</h2>
              <form class="">   
    <label for="default-search" class="mb-2 text-sm font-medium text-gray-900 sr-only dark:text-white">Search</label>
    <div class="relative">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
            </svg>
        </div>
        <input type="search" name="search" id="default-search" class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Search Recipe..."  />
        <button type="submit" class="text-white absolute end-2.5 bottom-2.5 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Search</button>
    </div>
</form>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Image</th>
                                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Filters</th>

                        </tr>
                    </thead>
                    <tbody  class="bg-white divide-y divide-gray-200">
                          {% for receipe in receipes %}
    <tr class="w-full">
      <td>{{ receipe.recipe_name }}</td>
      <td class="m-6">{{ receipe.recipe_desc }}</td>
      <td>
        {% if receipe.recipe_img %}
          <img src="/media/{{receipe.recipe_img}}" alt="{{ receipe.recipe_name }}" width="100" />
        {% endif %}
      </td>
      <td>
        <button type="button" class="px-4 py-2 bg-red-200 text-gray-700 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
        <a href="/delete_recipe/{{receipe.id}}" class="">Delete</a>
        </button>
         <button type="button" class="px-4 py-2 bg-green-200 text-gray-700 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
        <a href="/update_recipe/{{receipe.id}}" class="">Update</a>
        </button>
      </td>
    </tr>
   {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

  
{% endblock %}
